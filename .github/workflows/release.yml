name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - run: cargo metadata --locked --format-version 1
      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $rootPackageId = $metadata.workspace_default_members | Select-Object -First 1
          if ($null -eq $rootPackageId) {
            Write-Error "workspace root package id not found in cargo metadata"
            exit 1
          }
          $package = $metadata.packages | Where-Object { $_.id -eq $rootPackageId } | Select-Object -First 1
          if ($null -eq $package) {
            Write-Error "workspace root package not found in cargo metadata"
            exit 1
          }
          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            Write-Error "release tag '$env:RELEASE_TAG' does not match Cargo.toml version '$($package.version)' (expected '$expectedTag')"
            exit 1
          }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked

  build:
    needs: verify
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: sshw
            archive: sshw-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: sshw.exe
            archive: sshw-x86_64-pc-windows-msvc.zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: sshw
            archive: sshw-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: sshw
            archive: sshw-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package binary
        shell: pwsh
        run: |
          $sourceDateEpoch = git show -s --format=%ct HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "failed to read the release commit timestamp"
          }
          $python = if ("${{ runner.os }}" -eq "Windows") { "python" } else { "python3" }
          & $python .github/scripts/package_release.py `
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            --archive "dist/${{ matrix.archive }}" `
            --source-date-epoch $sourceDateEpoch
          if ($LASTEXITCODE -ne 0) {
            throw "deterministic release packaging failed"
          }
      - name: Attest archive provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/${{ matrix.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  publish:
    needs: build
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: "1.97.0"
      - name: Check crates.io publish state
        id: crate-state
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $rootPackageId = $metadata.workspace_default_members | Select-Object -First 1
          $package = $metadata.packages | Where-Object { $_.id -eq $rootPackageId } | Select-Object -First 1
          if ($null -eq $package) {
            throw "workspace root package not found in cargo metadata"
          }

          cargo package --locked
          if ($LASTEXITCODE -ne 0) {
            throw "cargo package failed"
          }
          $cratePath = "target/package/$($package.name)-$($package.version).crate"
          $localChecksum = (Get-FileHash -Algorithm SHA256 $cratePath).Hash.ToLowerInvariant()
          $headers = @{
            "User-Agent" = "sshw-release/$env:RELEASE_TAG (https://github.com/$env:GITHUB_REPOSITORY)"
          }
          $uri = "https://crates.io/api/v1/crates/$($package.name)/$($package.version)"

          try {
            $published = Invoke-RestMethod -Uri $uri -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -eq 404) {
              "should_publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
            throw
          }

          $publishedChecksum = $published.version.checksum.ToLowerInvariant()
          if ($publishedChecksum -ne $localChecksum) {
            throw "published crate checksum does not match the exact release tag package"
          }
          if ($published.version.yanked) {
            throw "the matching crates.io version is yanked"
          }
          "should_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Authenticate to crates.io
        if: steps.crate-state.outputs.should_publish == 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate to crates.io
        if: steps.crate-state.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$(basename "$file")"
          done < <(find artifacts -type f -print0 | sort -z) > SHA256SUMS
      - name: Attest SHA256SUMS provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t files < <(find artifacts -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release artifacts found" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" SHA256SUMS --generate-notes --repo "$GITHUB_REPOSITORY"
