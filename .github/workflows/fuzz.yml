name: Fuzz Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master action code
        with:
          toolchain: stable
      - run: cargo install cargo-fuzz --version 0.13.1 --locked
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master action code
        with:
          toolchain: nightly
      - run: cargo +nightly fuzz build redact_secrets
      - run: cargo +nightly fuzz build policy_file
      - run: cargo +nightly fuzz run redact_secrets -- -runs=1
      - run: cargo +nightly fuzz run policy_file -- -runs=1
