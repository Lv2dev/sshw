name: Fuzz Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch action; nightly selected below
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --version 0.13.1 --locked
      - run: cargo +nightly fuzz build redact_secrets
      - run: cargo +nightly fuzz build policy_file
      - run: cargo +nightly fuzz run redact_secrets -- -runs=1
      - run: cargo +nightly fuzz run policy_file -- -runs=1
