name: Fuzz Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: stable
      - run: cargo install cargo-fuzz --version 0.13.1 --locked
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: nightly
      - run: cargo +nightly fuzz build redact_secrets
      - run: cargo +nightly fuzz build policy_file
      - run: cargo +nightly fuzz run redact_secrets -- -runs=1
      - run: cargo +nightly fuzz run policy_file -- -runs=1
