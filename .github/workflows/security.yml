name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master action code
        with:
          toolchain: stable
      - run: cargo metadata --locked --format-version 1
      - run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1
      - run: cargo install cargo-deny --version 0.19.8 --locked
      - run: cargo deny --locked check
      - run: cargo deny --locked --manifest-path fuzz/Cargo.toml check
