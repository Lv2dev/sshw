name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master action code
        with:
          toolchain: stable
      - run: cargo metadata --locked --format-version 1
      - run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1
      - run: cargo install cargo-deny --version 0.19.8 --locked
      - run: cargo deny --locked check
      - run: cargo deny --locked --manifest-path fuzz/Cargo.toml check
