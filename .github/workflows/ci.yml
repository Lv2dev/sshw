name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: stable
      - run: cargo metadata --locked --format-version 1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Verify packaged Cargo install
        shell: pwsh
        run: |
          cargo package --locked
          if ($LASTEXITCODE -ne 0) {
            throw "cargo package failed"
          }

          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $rootPackageId = $metadata.workspace_default_members | Select-Object -First 1
          $package = $metadata.packages | Where-Object { $_.id -eq $rootPackageId } | Select-Object -First 1
          if ($null -eq $package) {
            throw "workspace root package not found in cargo metadata"
          }

          $packagePath = Join-Path "target/package" "$($package.name)-$($package.version)"
          if (-not (Test-Path -LiteralPath $packagePath -PathType Container)) {
            throw "packaged source directory not found: $packagePath"
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "sshw-cargo-install"
          cargo install --path $packagePath --locked --root $installRoot
          if ($LASTEXITCODE -ne 0) {
            throw "installing packaged crate failed"
          }

          $binaryName = if ("${{ runner.os }}" -eq "Windows") { "sshw.exe" } else { "sshw" }
          $binary = Join-Path (Join-Path $installRoot "bin") $binaryName
          $actualVersion = & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw "installed sshw version smoke failed"
          }
          $expectedVersion = "sshw $($package.version)"
          if ($actualVersion -ne $expectedVersion) {
            throw "installed version mismatch: expected '$expectedVersion', got '$actualVersion'"
          }

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: "1.89"
      - run: cargo check --locked --all-targets

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: stable
      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client
          sudo mkdir -p /run/sshd
      - name: Run integration tests
        run: bash .github/scripts/run_ssh_integration.sh

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master action code
        with:
          toolchain: stable
      - run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked --all-targets
      - run: cargo install cargo-deny --version 0.19.8 --locked
      - run: cargo deny --locked check
      - run: cargo deny --locked --manifest-path fuzz/Cargo.toml check
