[package]
name = "sshw-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
sshw = { package = "sshw-agent", path = ".." }

[[bin]]
name = "redact_secrets"
path = "fuzz_targets/redact_secrets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_file"
path = "fuzz_targets/policy_file.rs"
test = false
doc = false
bench = false
