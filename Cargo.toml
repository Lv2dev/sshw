[package]
name = "sshw-agent"
version = "0.11.0"
edition = "2024"
rust-version = "1.89"
description = "Cross-platform SSH helper for delegated local coding-agent access without plaintext secrets."
license = "MIT"
repository = "https://github.com/Lv2dev/sshw"
readme = "README.md"
keywords = ["ssh", "cli", "keyring", "automation"]
categories = ["command-line-utilities", "authentication"]
publish = ["crates-io"]
autobins = false
include = [
    "src/**",
    "build.rs",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
]

[lib]
name = "sshw"
path = "src/lib.rs"

[[bin]]
name = "sshw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
keyring-core = "1.0.0"
libssh2-sys = "0.3.1"
rpassword = "7.5.3"
rprompt = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ssh2 = "0.9.5"
tempfile = "3.27.0"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
openssl-sys = "0.9.116"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust", "vendored"] }
