# cargo-deny configuration. Run locally with `cargo deny check`.
# Gates the dependency graph on security advisories, licenses, and sources.

[advisories]
# Use the canonical RustSec advisory database and keep advisory lint levels
# explicit so cargo-deny default changes do not silently alter the CI gate.
db-urls = ["https://github.com/RustSec/advisory-db"]
# Fail on any crate with a known RUSTSEC advisory or a yanked release.
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"

[licenses]
# The root and fuzz manifests share this config. The libfuzzer-sys exception
# below is intentionally encountered only when auditing fuzz/Cargo.toml.
unused-license-exception = "allow"

# Permissive licenses present in the dependency tree. A crate offering a
# choice (e.g. "MIT OR Apache-2.0") is satisfied if any allowed license
# matches; an "AND" expression (e.g. unicode-ident's Unicode-3.0) needs each
# part allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
]

exceptions = [
    # libfuzzer-sys is fuzz tooling only; its expression is
    # `(MIT OR Apache-2.0) AND NCSA`.
    { name = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
# Duplicate transitive versions are common and benign; surface them without
# failing the build.
multiple-versions = "warn"

[sources]
# Only crates.io is expected; reject anything from an unknown registry or git.
unknown-registry = "deny"
unknown-git = "deny"
